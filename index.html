<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Fat Babies</title>
<style>
  :root { --bg:#fffaf3; --fg:#3d3230; --muted:#8a7a72; --accent:#e08a5f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1a19; --fg:#f2e9e2; --muted:#a2928a; --accent:#f0a077; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    padding:16px; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    text-align:center; line-height:1.6;
  }
  h1 { font-size:clamp(2rem,7vw,3.5rem); margin:0 0 .25em; letter-spacing:-.02em; }
  .paws { font-size:clamp(2rem,9vw,3rem); margin-bottom:.4em; }
  p { color:var(--muted); max-width:34ch; margin:0 auto .5em; }
  .accent { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
  <main>
    <div class="paws">🐾 🐾 🐾</div>
    <h1>Three Fat Babies</h1>
    <p>Something new is being built here.</p>
    <p class="accent">Stay pawsome and come back soon!</p>
  </main>
</body>
</html>
